name: vortice_app
description: Vórtice Mechanical — Marine & Heavy Equipment Maintenance Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.9

  # Offline storage
  drift: ^2.20.3
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4

  # Navigation
  go_router: ^14.2.7

  # Serialization & models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Localization
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.3.2

  # Image picking & processing
  image_picker: ^1.1.2

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # Signature pad
  syncfusion_flutter_signaturepad: ^28.1.33

  # Excel export
  excel: ^4.0.6

  # HTTP for exchange rates
  http: ^1.2.2

  # File handling
  open_file: ^3.5.7
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
