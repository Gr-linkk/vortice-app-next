name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up PowerShell
        shell: bash
        run: command -v pwsh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Verify repository
        shell: pwsh
        run: |
          $baseRef = if ('${{ github.event_name }}' -eq 'pull_request') {
            '${{ github.event.pull_request.base.sha }}'
          } else {
            ''
          }
          ./scripts/verify.ps1 -BaseRef $baseRef
